name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every day at midnight to update stats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # Added theme=neon directly into options
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=github&theme=neon
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # Added theme=neon directly into options
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=neon
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          BLOCK HERE FOR THE STREAK GRAPH:
      - name: Generate GitHub Streak Stats
        uses: DenverCoder1/github-readme-streak-stats-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          theme: neon
          hide_border: true
          path: profile/streak.svg

      - name: Commit updated statistics
        run: |

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update daily stats with native neon theme"
          git push
